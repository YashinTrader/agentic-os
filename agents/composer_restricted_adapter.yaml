schema_version: "1.0"
updated_at: 2026-07-12T12:00:00Z
id: composer-restricted
display_name: Grok Build (Grok 4.5)
adapter_type: agent_cli
provider: xai
executable: composer
agent_id: composer
status: preview
promotion_state: restricted_candidate
command_template: "composer agent run --task-id {task_id} --worktree {worktree_path} --output {agent_output_path}"
allowed_commands:
  - composer
required_clis:
  - composer
minimum_version: "0.0.0"
active: true
supports_preview: true
supports_dry_run: true
supports_execution: false
execution_scope: local_worktree
dedicated_runner_required: true
required_execution_route: composer_local_builder
maximum_runs: 0
automatic_disable_after_run: false
live_run_authorized: false
phase3_7b_authorization_required: false
writes_files: true
worktree_required: true
network_required: false
secrets_required: false
mcp_required: false
approval_level: none
risk_level: high
timeout_seconds: 1800
maximum_timeout_seconds: 1800
allowed_subcommands:
  - agent
allowed_flags:
  - "--task-id"
  - "--worktree"
  - "--output"
forbidden_flags:
  - "--dangerously-bypass-approvals-and-sandbox"
  - "--dangerously-bypass-hook-trust"
  - "--dangerously-bypass-approvals"
  - "--execute"
  - "--force"
environment_allowlist:
  - PATH
  - HOME
  - USERPROFILE
  - TEMP
  - TMP
  - SYSTEMROOT
  - XAI_API_KEY
  - GROK_API_KEY
environment_denylist:
  - AGENTIC_OS_HUMAN_APPROVAL_KEY
  - AGENTIC_OS_REVIEWER_APPROVAL_KEY
  - GITHUB_TOKEN
  - SUPABASE_KEY
output_format: json
context_bundle_required: true
handoff_required: true
rollback_required: true
working_directory_policy: worktree
env_vars_required: []
forbidden_args:
  - "--dangerously-bypass-approvals-and-sandbox"
  - "--dangerously-bypass-hook-trust"
  - "--execute"
  - "--force"
supports_streaming: false
wake:
  enabled: true
  mechanism: physical_supervisor
  command_or_path: scripts/run_orchestrator.py
notes: >
  Stable id composer-restricted / agent_id composer retained for reference continuity.
  Display name: Grok Build (Grok 4.5) as of 2026-07-12. Phase 3.9.1 physical supervisor
  (scripts/run_orchestrator.py) consumes wake records and launches the Grok Build CLI
  with shell=False. Manual scripts/watch_assignments.py only claims and is not a launcher.
  Merge, push, and deploy remain manual operator steps.
  MCP isolation gap (Phase 3.9.5): Grok Build CLI has no documented per-invocation
  MCP allowlist equivalent to Codex `-c mcp_servers={}` / `--ignore-user-config`.
  required_mcp_servers is recorded on LaunchPlan for policy parity; argv cannot yet
  enforce zero-MCP isolation for composer launches.
